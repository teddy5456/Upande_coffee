<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Upande Coffee">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6437"/>
      <stop offset="100%" stop-color="#53381c"/>
    </linearGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ead9"/>
      <stop offset="100%" stop-color="#d9c3a3"/>
    </linearGradient>
  </defs>
  <!-- rounded coffee tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)"/>
  <!-- coffee bean, tilted -->
  <g transform="rotate(-28 64 64)">
    <ellipse cx="64" cy="64" rx="30" ry="42" fill="url(#bean)"/>
    <!-- seam that sweeps up into an arrow (the Upande forward motion) -->
    <path d="M64 26 C50 44 78 62 64 82 C56 94 62 100 64 102"
          fill="none" stroke="#6f4e29" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Upande arrow accent, forward/up-right, in Upande green -->
  <path d="M86 84 L102 68 M102 68 L102 82 M102 68 L88 68"
        fill="none" stroke="#3fae6a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
